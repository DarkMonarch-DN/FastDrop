version: "3.8"

services:
  postgres-db:
    image: "postgres:15-alpine"
    container_name: "fast_drop_postgres"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fast_drop

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis-db:
    image: "redis:7-alpine"
    container_name: "fast_drop_redis"
    ports:
      - "6379:6379"
    environment:
      - REDIS_HOST=redis-db

  web-app:
    build: .
    container_name: "fast_drop_fastapi"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=fast_drop
    depends_on:
      - postgres-db
      - redis-db

volumes:
  pgdata:
